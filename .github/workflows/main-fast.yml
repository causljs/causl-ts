name: main-fast

# Fast lane for the `main` branch (and PRs targeting main).
#
# Per the CI contract introduced alongside this file:
#
#   - `main` push + PRs targeting `main`  -> ONLY build + lint
#   - `release` push + PRs targeting `release` -> FULL verification
#     (tests, e2e, bundle-budget, vendor-manifest, wasm matrix,
#     four-way-classifier, etc. — each lives in its own workflow).
#
# Husky hooks remain the local safety net for the FULL set — see
# `.husky/pre-commit` and `.husky/pre-push`. CI on `main` deliberately
# trades thoroughness for sub-five-minute feedback so PR authors can
# iterate quickly; the merge gate to `release` re-runs every heavy
# check before anything ships.
#
# What runs here:
#   1. TypeScript typecheck across the workspace (`pnpm typecheck`)
#   2. TypeScript build across the workspace (`pnpm build`)
#   3. ESLint across the workspace (`pnpm lint`)
#
# What deliberately does NOT run here:
#   - Unit / integration / property tests   -> release-side
#   - E2E (Playwright, formula 60fps gate)  -> release-side
#   - vendor MANIFEST.json freshness gate    -> release-side
#   - commitment-audit + test-d / tsd gates  -> release-side
#
# AMENDED 2026-09-02 (issues #48 / #49). `bundle-budget.yml` and `wasm.yml` used
# to sit on the release lane and this header still said so. Both now also run on
# `main` and on PRs, for one reason: `origin/release` has been pinned at
# `febe37e` since 2026-05-17, so the release lane fires on nothing and anything
# parked there is not a gate, it is a file. Neither workflow costs much now that
# `wasm.yml` no longer installs a Rust toolchain it never used, so the main lane
# still comes in well under five minutes.
#
# A new Rust crate landing in this repo (there is none, and the wasm.yml crates
# that were described as defensive-future have been removed per #49 because they
# were never coming) should add a sibling `cargo-fast` job here that runs
# `cargo check` only; `cargo test` + `clippy -D warnings` stay on the release
# lane.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-fast:
    name: TypeScript — typecheck + build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Regression gate for #31: dist/testing.d.ts must not contain a
      # bare `export * from '@causl/core-testing-internal'`, because that
      # specifier does not resolve in any downstream node_modules (the
      # internal workspace package is `private: true` and unpublished).
      # The script packs @causlts/core, installs the tarball into a
      # throwaway dir outside the workspace, and runs `tsc --noEmit` on
      # a tiny consumer file that imports from `@causlts/core/testing`.
      - name: '#31 regression — consumer typecheck against packed tarball'
        run: bash scripts/check-core-testing-types.sh
