name: wasm

# What this repository does with wasm, and what it therefore checks.
#
# It does not build any. The Rust engine and its build tooling live in
# `causljs/causl-wasm`; `packages/core/wasm-pkg/README.md` opens by saying so.
# What lands here is the built output, vendored under
# `packages/core/wasm-pkg/<bridge>-<target>/`, consumed by the
# `@causlts/core/wasm` loader, the bundler-interop fixtures and the
# bridge-roundtrip property suite.
#
# WHAT I REMOVED, AND WHY (issue #49)
#
# This file used to carry a `cargo check (workspace, defensive)` job and a
# six-leg `wasm-pack build` matrix. Every step in both hung off a presence
# guard: `if: steps.detect.outputs.present == 'true'` for the crates,
# `if [ -f Cargo.toml ]` for the workspace. Neither condition has ever been true
# here. `git log --all -- tools/enumerator` returns nothing, and there is no
# `Cargo.toml` anywhere in the tree or in its history. So seven of this
# workflow's ten jobs reported green having run checkout, install and a notice.
# I pulled the step list out of run 33647334864 to confirm it, and the
# `Size-limit cells (raw bytes)` step, which lived behind the same guard, is not
# in it. It has never run.
#
# The `driver sanity` step was worse than a skip. It ran
# `pnpm wasm:build:check || echo "::warning::..."`, and since
# `tools/wasm-build/build.mjs` is not in this repo, every leg printed
# `Error: Cannot find module` and swallowed it as a yellow warning. Those two
# `package.json` scripts are gone now, replaced by `wasm:verify`.
#
# WHAT REPLACED IT
#
#   - `vendored-wasm` opens the six committed artefacts and checks the bytes:
#     WASM preamble, a non-trivial-size floor that an 8-byte stub cannot clear,
#     the RAW ceiling each `size-limit` cell declares, and the bundler/nodejs
#     byte-identity the `wasm-pkg` README asserts. It runs its own unit cover
#     first, including the negative case where a stub sits in for a bridge.
#   - `bundler-interop` is unchanged. It was already doing real work and it is
#     what the 2026-05-17 red run was actually about.
#
# The JS size cells moved to `bundle-budget.yml`, which now runs
# `tools/bundle-budget/report.mjs gate` on every event. That is the workflow
# that enforces them; this one enforces the raw `.wasm` bytes.
#
# Triggers: this used to be `release`-only, and `origin/release` has been pinned
# at `febe37e` since 2026-05-17, so it fired on nothing. Without the Rust
# toolchain, wasm-pack and binaryen the workflow now finishes in about a minute,
# which is well inside the `main`-lane budget `main-fast.yml` describes, so it
# runs where the commits are.
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-wasm:
    name: vendored wasm artefacts (bytes, ceilings, target parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # The verifier's own cover, and the reason to trust the job below it. It
      # is `node:test` with no dependencies, so it runs before the install. The
      # test that earns its keep is the one feeding it the 8-byte preamble stub
      # `e2e/bundler-interop/stub-wasm-pkg.mjs` writes: that buffer is valid
      # WebAssembly, so a checker that only looks at the magic waves it through.
      - name: Test the vendored-wasm verifier
        run: pnpm wasm:verify:test

      - name: Verify the committed wasm artefacts
        run: pnpm wasm:verify

  bundler-interop:
    name: bundler-interop (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    # Issue #689 — three minimal fixture apps under e2e/bundler-interop/
    # that import `@causlts/core` (main barrel) and dynamically import
    # `@causlts/core/wasm` (lazy-load entry). Each fixture's `verify.mjs`
    # enforces the bundle-no-wasm-leak invariant: the main chunk must
    # not contain the `loadWasmBackend` / `WasmBackendUnavailableError`
    # sentinels, and some other chunk MUST contain them (proves the
    # dynamic import was preserved as a code-split rather than
    # inlined).
    #
    # Failures attributable to a specific bundler are labelled by the
    # matrix-leg name, satisfying the "labelled per bundler" piece of
    # #689's exit criterion.
    #
    # Per-fixture install runs with `npm install --no-save` rather than
    # via pnpm: the fixtures live OUTSIDE the workspace by design
    # (#689 — fixtures must mirror how an external adopter consumes
    # `@causlts/core`, not a workspace member that can resolve devDeps
    # the wild adopter wouldn't have access to). The `file:` specifier
    # in each fixture's package.json resolves into the freshly-built
    # `packages/core/` directory.
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: webpack5-app
          - fixture: vite5-app
          - fixture: esbuild-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # The fixtures consume `@causlts/core` via a `file:` specifier that
      # points at `packages/core/`. The bundler reads `packages/core/dist/`
      # via the package's `exports` map, so a build must happen first.
      #
      # `--fail-if-no-match` is load-bearing. pnpm answers an unmatched filter
      # with `No projects matched the filters` and exit code 0, so the #46
      # rename could have left this step green while it built nothing and the
      # fixtures then died on an unresolvable specifier one step later. That is
      # exactly what it did to `.husky/pre-push`, which still said `@causl/core`.
      - name: Build @causlts/core
        run: pnpm --filter @causlts/core --fail-if-no-match run build

      # Stub the wasm-pkg artifact tree so bundlers that statically
      # analyse `new URL('./pkg/...', import.meta.url)` (notably
      # webpack 5 with `experiments.asyncWebAssembly`) can resolve
      # the asset paths. The stubs are minimal-valid 8-byte WASM
      # modules; they're never instantiated — `loadWasmBackend()`
      # throws before reaching the fetch path. See
      # `e2e/bundler-interop/stub-wasm-pkg.mjs` for the rationale.
      #
      # The stubs go to `packages/core/dist/pkg/`, a build output the loader
      # resolves against, and never to the committed `packages/core/wasm-pkg/`
      # tree the `vendored-wasm` job gates. The two do not touch, which is what
      # keeps a fixture run from writing an 8-byte file over a real 214 KB
      # artefact.
      - name: Stub wasm-pkg artifacts (bundler resolver bait)
        run: node e2e/bundler-interop/stub-wasm-pkg.mjs

      - name: Install fixture deps (${{ matrix.fixture }})
        working-directory: e2e/bundler-interop/${{ matrix.fixture }}
        run: npm install --no-save --no-audit --no-fund

      - name: Build fixture (${{ matrix.fixture }})
        working-directory: e2e/bundler-interop/${{ matrix.fixture }}
        run: npm run build

      - name: Verify bundle-no-wasm-leak (${{ matrix.fixture }})
        working-directory: e2e/bundler-interop/${{ matrix.fixture }}
        run: npm run verify
