name: bundle-budget

# The bundle-size gate, plus the per-PR comment that names the cell which moved.
#
# WHY THIS FILE NO LONGER USES `andresz1/size-limit-action@v1` (issue #48)
#
# The action's `src/main.ts` opens with
# `if (!pr) throw new Error("No PR found. Only pull_request workflows are
# supported.")`. So every `push:` and `workflow_dispatch` run was red before a
# byte got measured, and that is a property of the action rather than of the
# configuration. Run 26002600496 (push to `main`, 2026-05-17) and run
# 33647348710 (dispatch on `main`, 2026-09-02) are both that single line.
#
# Parking the lane was not an option, because `size-limit` is the ONLY place the
# JS ceilings are enforced and while this workflow was dead nothing ran it:
# `wasm.yml`'s size step sat behind a guard that is always false in this repo,
# and `main-fast.yml` says in its own header that size-limit is release-side. So
# I rebuilt both halves natively and kept them apart:
#
#   - `tools/bundle-budget/report.mjs gate` is the blocking half. It reads the
#     `passed` flag size-limit computes per cell and refuses loudly if the
#     payload is empty or unparseable, because a crashed measurement that
#     reports green is the failure mode worth designing against. It runs on
#     every event.
#   - `tools/bundle-budget/report.mjs render` + `post` is the reporting half.
#     Only `post` needs a pull request, and now it is the only thing that does.
#
# The old triggers were `pull_request: branches: [release]` + `push: branches:
# [release]`, and `origin/release` has been pinned at `febe37e` since
# 2026-05-17, so even a working action would never have fired. The triggers
# below point at branches that move.
#
# The cells are declared under `size-limit` in the root `package.json` and the
# reasoning behind each ceiling lives beside them there and in
# `docs/bundle-budget.md`. I deliberately do not restate the list here: the copy
# that used to sit in this header still named `@causl/*` specifiers the #46
# rename retired, which is exactly how a comment-as-record goes stale.
#
# This workflow does not build any wasm. The three raw `.wasm` cells read the
# committed artefacts under `packages/core/wasm-pkg/`, and `wasm.yml` is where
# those bytes are verified.

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: bundle-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-budget:
    name: bundle-budget — size-limit gate + per-PR comment (#10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The base measurement fetches one more commit by hand, so a shallow
          # clone is enough and I keep the default.
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      # The reporter's own cover, run before anything depends on it. It is seven
      # fast assertions on `node:test` with no dependencies, so it runs before
      # the install, and it is the difference between trusting the table and
      # hoping.
      - name: Test the bundle-budget reporter
        run: pnpm budget:test

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm run build

      # size-limit writes its array to stdout and exits non-zero on an overage,
      # so the file lands either way and the verdict is read from the payload
      # rather than from this step's exit code. That keeps the comment posting
      # even when a cell is over, which is the run where a reviewer most wants
      # to see the table.
      - name: Measure head bundle sizes
        run: pnpm exec size-limit --json > "$RUNNER_TEMP/budget-head.json" || true

      # The base half of the delta. It is best-effort on purpose: a base branch
      # that will not build is a fact about the base, and it must not turn this
      # PR red. `render` degrades to a head-only table when the file is missing
      # or unreadable, and says so in the comment.
      - name: Measure base bundle sizes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          HEAD_SHA="$(git rev-parse HEAD)"
          if git fetch --depth=1 origin "$BASE_REF" \
            && git checkout -f FETCH_HEAD \
            && pnpm install --frozen-lockfile \
            && pnpm run build; then
            pnpm exec size-limit --json > "$RUNNER_TEMP/budget-base.json" || true
          else
            echo "I could not build $BASE_REF, so the comment will be head-only."
          fi
          # Nothing after this reads the working tree, only the two JSON
          # payloads, so restoring the source is enough and I skip a second
          # install plus build.
          git checkout -f "$HEAD_SHA"

      - name: Render the report
        run: |
          BASE_ARG=""
          if [ -s "$RUNNER_TEMP/budget-base.json" ]; then
            BASE_ARG="--base $RUNNER_TEMP/budget-base.json"
          fi
          node tools/bundle-budget/report.mjs render \
            --head "$RUNNER_TEMP/budget-head.json" \
            $BASE_ARG \
            --out "$RUNNER_TEMP/budget-comment.md"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          BUDGET_API_BASE: ${{ github.api_url }}
          BUDGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUDGET_REPO: ${{ github.repository }}
          BUDGET_PR: ${{ github.event.pull_request.number }}
        run: node tools/bundle-budget/report.mjs post --body "$RUNNER_TEMP/budget-comment.md"

      # The blocking verdict, last, so the comment is already on the PR when the
      # check goes red.
      - name: Enforce the ceilings
        run: node tools/bundle-budget/report.mjs gate --head "$RUNNER_TEMP/budget-head.json"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/budget-comment.md" >> "$GITHUB_STEP_SUMMARY" || true
